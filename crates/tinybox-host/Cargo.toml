[package]
name = "tinybox-host"
description = "Hosts that give tinybox reach: the local machine, and later SSH."
documentation = "https://docs.rs/tinybox-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
tinybox-core.workspace = true
tinybox-jail.workspace = true
async-trait.workspace = true
# `Dir` keeps workspace file handles beneath the approved root without
# resolving untrusted paths through ambient filesystem APIs.
cap-std = "4"
# `LocalHost` spawns a child and reads both its output streams concurrently,
# which is what `tokio::process` is for; doing it by hand risks deadlocking on a
# full pipe buffer.
tokio = { workspace = true, features = ["process", "io-util", "sync"] }

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling keeps shell descendants within supervised cleanup.
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
# Job Objects keep supervised Windows descendants inside one killable process tree.
command-group = { version = "5", features = ["with-tokio"] }

[dev-dependencies]
# Command tests run against real temporary directories rather than the CWD.
tempfile = "3"

[lints]
workspace = true
