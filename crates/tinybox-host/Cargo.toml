[package]
name = "tinybox-host"
description = "Hosts that give tinybox reach: the local machine, and later SSH."
documentation = "https://docs.rs/tinybox-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
tinybox-core.workspace = true
# Shell selection shares the module's serialized invocation vocabulary.
tinybox-bus.workspace = true
tinybox-jail.workspace = true
async-trait.workspace = true
# The host supervises async native-shell output and bounded poll delays.
futures-util = { version = "0.3", features = ["async-await"] }
futures-timer = "3"
# `Dir` keeps workspace file handles beneath the approved root without
# resolving untrusted paths through ambient filesystem APIs.
cap-std = "4"
# `LocalHost` spawns a child and reads both output streams concurrently.
# `limited::jailed` also adapts backend-owned file pipes for async collection.
tokio = { workspace = true, features = ["process", "io-util", "sync", "fs", "net"] }

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling supervises descendants; access checks select executable shells.
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# Job Objects keep supervised Windows descendants inside one killable process tree.
command-group = { version = "5", features = ["with-tokio"] }

[dev-dependencies]
# Command tests run against real temporary directories rather than the CWD.
tempfile = "3"
# Drives the runtime-neutral native shell orchestration tests without a runtime.
futures-executor = "0.3"

[lints]
workspace = true
