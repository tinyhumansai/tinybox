[package]
name = "tinybox-module"
description = "TinyBus module exposing the tinybox workspace runtime over the bus."
documentation = "https://docs.rs/tinybox-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
# The released artifact must stay `libtinybox.so` / `libtinybox.dylib` /
# `tinybox.dll` regardless of the package name, because `release.yml` derives
# the packaged file name from this.
name = "tinybox"
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Serialized-only module vocabulary, shared with hosts independently of backends.
tinybox-bus.workspace = true
# The module constructs local reach itself, keeping process handles module-owned.
tinybox-host.workspace = true
# Native jail probing and enforcement stay inside the compiled module.
tinybox-jail.workspace = true
# The module composes the owned local SSH process host with remote sandbox providers.
tinybox-ssh.workspace = true
# Random instance identity prevents reservations from another module incarnation binding.
uuid = { version = "1", features = ["v4"] }
# Resource operations serialize against close and allocate opaque identifiers.
tokio.workspace = true
tinybox-core.workspace = true
tinybox-docker.workspace = true
tinybox-linux.workspace = true
tinybox-microvm.workspace = true
tinybus.workspace = true
tinybus-module.workspace = true
# Box records live on the host's storage ports, reached over the storage bus;
# the module has no storage backend or file of its own.
tinybox-drivers.workspace = true
tinystoragedrivers-core.workspace = true
tinystoragedrivers-busproxy.workspace = true
log = "0.4"

# Private shell scratch is owned until supervised process cleanup completes.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# Stdio children own a process group that is killed as a unit.
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }

[dev-dependencies]
# Tests serve the storage objects on the in-memory broker the module connects to.
tinystoragedrivers-client.workspace = true
# Deterministic delayed-host fixtures implement the existing object-safe host trait.
async-trait.workspace = true
# Module integration tests exercise the real asynchronous in-memory TinyBus.
# `test-util` lets the stdio cleanup-deadline tests pause the clock.
tokio = { workspace = true, features = ["test-util"] }
# The GitHub release verifier passes an explicit empty module configuration.
serde_json.workspace = true

[features]
default = []
linked = ["static-link"]
static-link = []

[lints]
workspace = true
