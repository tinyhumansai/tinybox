[package]
name = "tinybox-jail"
description = "Per-process directory jail for spawned commands: bubblewrap, Landlock, Seatbelt, and AppContainer."
documentation = "https://docs.rs/tinybox-jail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# On by default so a plain dependency is actually confined on Linux. Without
# the feature `LandlockBackend` reports itself unavailable and `spawn` returns
# `Unsupported` (it never runs the command unconfined).
default = ["landlock"]
landlock = ["dep:landlock"]

[dependencies]
log = "0.4"
# Reuse the workspace clock so registry timestamps can be controlled in tests.
tinybox-core.workspace = true
# Serialized host-owned grant configuration and protected-path floor.
tinybox-bus.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }
# `NamespaceProbe` locates `bwrap`; reused so there is one definition of how the
# Linux backends find it.
tinybox-linux.workspace = true

[target.'cfg(windows)'.dependencies]
# AppContainer profile APIs, ACL editing, STARTUPINFOEXW process spawn, and the
# GENERIC_* file access masks used by `windows.rs`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tinystoragedrivers-api.workspace = true
tinystoragedrivers-testkit.workspace = true
tinystoragedrivers-types.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Clears close-on-exec on a descriptor in the fd-leak regression test; the safe
# `fcntl_setfd` avoids `unsafe`, which the workspace forbids. Already in the
# lockfile through tempfile.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
