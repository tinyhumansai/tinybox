[package]
name = "tinybox-docker"
description = "A tinybox sandbox backed by Docker containers."
documentation = "https://docs.rs/tinybox-docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
tinybox-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# `DockerCli` runs the local `docker` client; one-shot runs need process spawning
# and a deadline.
tokio = { workspace = true, features = ["process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio.workspace = true
# The live suite drives a real daemon through the real local host.
tinybox-host.workspace = true
tempfile = "3"

[lints]
workspace = true
