[package]
name = "tinybox-openshell"
description = "A tinybox sandbox backed by NVIDIA OpenShell sandboxes."
documentation = "https://docs.rs/tinybox-openshell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The `Sandbox`, `Host` and `Store` traits this backend implements and the
# model types (`BoxSpec`, `ExecRequest`) it exchanges.
tinybox-core.workspace = true
# `Sandbox` is an async trait; its methods are declared with this macro.
async-trait.workspace = true
# `openshell sandbox get -o json` is the one structured answer this backend
# reads: the sandbox's lifecycle phase.
serde_json.workspace = true

[dev-dependencies]
# The async runtime the `#[tokio::test]` tests run on.
tokio.workspace = true

[lints]
workspace = true
