[package]
name = "tinybox-bus"
description = "Serializable TinyBox module contract without a runtime or backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The bus boundary contains data only; serialization is its sole dependency.
serde.workspace = true
# Only the `storage` feature: pure collection and legacy-body vocabulary.
serde_json = { workspace = true, optional = true }
tinystoragedrivers-types = { workspace = true, optional = true }

[features]
default = []
# `collections()` and pure v1-to-v2 body converters. Off by default so the
# contract's default dependency closure stays serde only; a host enables it.
storage = ["dep:serde_json", "dep:tinystoragedrivers-types"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
