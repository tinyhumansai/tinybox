[package]
name = "tinybox-cli"
description = "The tinybox command-line interface."
documentation = "https://docs.rs/tinybox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
tinybox-core.workspace = true
tinybox-host.workspace = true
tinybox-docker.workspace = true
tinybox-linux.workspace = true
tinybox-microvm.workspace = true
tinybox-ssh.workspace = true
tinybox-sync.workspace = true
# Argument parsing, help text, and shell-facing errors. The derive API keeps the
# command surface declared next to the types it produces.
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Unit tests compose the production port adapters over the testkit's memory
# backend; the binary's process-level tests live in `tinybox-bin`.
tempfile = "3"
# Tests implement a scripted `Host` so the Docker paths are reachable without a
# daemon.
async-trait.workspace = true

[lints]
workspace = true
