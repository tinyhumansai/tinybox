name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-unsafe-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test the Windows FFI allowance guard
        run: scripts/ci/check-windows-unsafe-boundary_tests.sh
      - name: Check the Windows FFI allowance boundary
        run: scripts/ci/check-windows-unsafe-boundary.sh
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
      apt-packages: bubblewrap
  native-resource-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Install rootless native jail prerequisites
        run: |
          source scripts/ci/prepare-rootless-native-resources.sh
      - name: Run required Linux native resource proofs
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/${uid}"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module native_
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module resource_aware_bus_exec_cancellation_reports_events_and_reaps_descendants
  # The real-bubblewrap suites. They skip when bwrap cannot run (Ubuntu 24.04
  # blocks unprivileged user namespaces by default), so this job makes bwrap
  # usable and requires it: a skip here is a failure, not a pass.
  bwrap-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Make unprivileged bubblewrap usable
        run: |
          source scripts/ci/prepare-bwrap.sh
      # The image ships passt (a podman Recommends). Without it this job keeps
      # the default shared-network path covered; the pasta job covers the other.
      - name: Remove pasta so the shared-network path is the one tested
        run: |
          if dpkg -s passt >/dev/null 2>&1; then sudo apt-get remove --yes passt; fi
          if command -v pasta >/dev/null 2>&1; then echo "pasta still present" >&2; exit 1; fi
      - name: Run the real-bubblewrap suites, refusing to skip
        shell: bash
        env:
          TINYBOX_REQUIRE_BWRAP: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p tinybox-jail --test bwrap_isolation --test bwrap_fd_leak -- --nocapture
          cargo test --locked -p tinybox-jail --lib bwrap
  bwrap-pasta-live:
    name: Bubblewrap private network (pasta) reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Make unprivileged bubblewrap usable
        run: |
          source scripts/ci/prepare-bwrap.sh
      - name: Install passt (pasta) and util-linux (nsenter)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends passt util-linux
          pasta --version | head -1
      - name: Prove outbound works and host loopback, gateway and abstract sockets do not
        env:
          TINYBOX_REQUIRE_BWRAP: "1"
          TINYBOX_REQUIRE_PASTA: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p tinybox-jail --test bwrap_pasta_live -- --nocapture
          cargo test --locked -p tinybox-jail --test bwrap_isolation -- --nocapture
          cargo test --locked -p tinybox-jail --test bwrap_fd_leak -- --nocapture
  docker-network-live:
    name: Docker Egress and denied network connectivity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Require Docker daemon and default bridge gateway
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker daemon ready: {{.ServerVersion}}'
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$gateway"
          echo "Docker bridge gateway: $gateway"
      - name: Prove Egress connectivity and default-Denied refusal
        env:
          TINYBOX_LIVE_DOCKER: "1"
          TINYBOX_REQUIRE_LIVE_DOCKER: "1"
        run: >-
          cargo test --locked -p tinybox-docker --test live_docker
          live_network_policy_controls_host_listener_connectivity --
          --nocapture --test-threads=1
      - name: Prove the module detects allowlist enforcement on this host
        env:
          TINYBOX_LIVE_DOCKER: "1"
        run: >-
          cargo test --locked -p tinybox-module --lib
          live_detection_installs_the_controller_on_a_capable_host --
          --nocapture
